# CopperSpice MSVC /W4 example, links point to the local checkout in C:\project\copperspice
# run from anywhere: python3 verification/opencanary.py run -c example__cs_1/opencanary.toml

[[input]]
format = "msvc"
source = "msvc"
path = "log.w4.all.txt"

[rules]
interest = "../verification/examples/interest_copperspice.txt"
customize = "../verification/examples/customize_copperspice.txt"

[customize]
msvc = true            # show windows style paths in the report
reference_depth = 2    # C:\project\internal-copperspice\src\x.h -> src/x.h, appended to PERMALINK_PREFIX

[output]
issues = "issues.txt"
report = "report.local.html"
environment = "env.local.txt"
